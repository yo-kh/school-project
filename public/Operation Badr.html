<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Operation Badr</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Cairo:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&family=Reem+Kufi:wght@600&display=swap">
<style>
/* Layout: the game fills the viewport. A slim title bar and HUD sit above a stage that is fitted by script to the largest 2:3 box that fits, centred on a patterned slate ground. Dialogue docks to the bottom of the stage, chapter cards cover it. Single committed dark look; canal blue and sand on slate. */
:root{
  --ink:#0f1a20;
  --panel:#16252d;
  --line:#2c4350;
  --sand:#d2ad6e;
  --canal:#1d7a96;
  --flag:#c8392f;
  --text:#e7e3d6;
  --mute:#9db0b8;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  --f-ar:"Reem Kufi","Cairo",serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--ink);color:var(--text);
  font:15px/1.55 var(--f-body);
  padding-block:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.app{height:100%;display:flex;flex-direction:column;background:var(--ink)}
header{display:flex;flex-direction:row;align-items:center;gap:8px;padding-block:8px 2px}
header a{color:var(--text);display:flex;align-items:center;justify-content:center;width:38px;height:38px;flex:none}
header a:focus-visible{outline:2px solid var(--text);outline-offset:2px}
svg{width:24px;height:24px;cursor:pointer}
[data-lang=ar] header svg{transform:scaleX(-1)}
.header-text{display:flex;flex-direction:column;align-items:center;width:100%;min-width:0;text-align:center}
.kicker{font:500 10px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--sand)}
h1{margin:0;font:700 24px/1.05 var(--f-display);letter-spacing:.03em;text-transform:uppercase}
.fs{flex:none;background:transparent;border:1px solid var(--line);color:var(--text);width:38px;height:38px;font-size:18px;line-height:1;cursor:pointer}
.fs:hover{border-color:var(--sand)}
.fs:focus-visible,.btn:focus-visible,.opt:focus-visible{outline:2px solid var(--text);outline-offset:3px}
.hud{display:flex;justify-content:space-between;gap:8px;font:500 12px var(--f-mono);color:var(--mute);letter-spacing:.04em;min-height:22px;align-items:center}
.hud span{min-width:0}
.wrap{flex:1;min-height:0;display:grid;place-items:center;padding-bottom:8px;
  background:repeating-linear-gradient(135deg,transparent 0 22px,rgba(210,173,110,.04) 22px 23px)}
.stage{position:relative;border:1px solid var(--line);background:#000;overflow:hidden;touch-action:none;width:300px;height:450px}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:pointer}
.ov{position:absolute;inset:0;background:rgba(15,26,32,.95);padding:calc(22px*var(--u,1));display:flex;flex-direction:column;overflow:auto}
.ov .in{margin:auto;display:grid;gap:calc(14px*var(--u,1));width:100%}
.ov h2{margin:0;font:700 calc(34px*var(--u,1))/1.05 var(--f-display);text-transform:uppercase;text-wrap:balance}
.ov p{margin:0;max-width:60ch;font-size:clamp(13px,calc(15px*var(--u,1)),24px)}
.tag{font:500 calc(11px*var(--u,1))/1.3 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--sand)}
.how{color:var(--mute);border-inline-start:2px solid var(--canal);padding-inline-start:12px}
.ar{font:600 calc(64px*var(--u,1))/1.1 var(--f-ar);color:var(--sand);direction:rtl;text-align:start}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{background:var(--sand);color:var(--ink);border:0;padding:12px 22px;font:700 calc(18px*var(--u,1)) var(--f-display);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;justify-self:start}
.btn:hover{background:#e4c98f}
.big{font:700 calc(64px*var(--u,1))/1 var(--f-display);font-variant-numeric:tabular-nums}
.big small{font-size:.4em;color:var(--mute)}
.facts{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.facts li{font-size:clamp(12.5px,calc(13.5px*var(--u,1)),22px);line-height:1.5;padding-inline-start:12px;border-inline-start:2px solid var(--line)}
.facts b{color:var(--sand);font-weight:500}
.rows{display:grid;gap:6px;font:500 calc(12px*var(--u,1)) var(--f-mono);color:var(--mute)}
.rows div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:6px;font-variant-numeric:tabular-nums}
.dlg{position:absolute;left:0;right:0;bottom:0;background:rgba(15,26,32,.96);border-top:2px solid var(--sand);padding:calc(12px*var(--u,1)) calc(16px*var(--u,1)) calc(14px*var(--u,1));display:grid;gap:6px;min-height:calc(112px*var(--u,1));cursor:pointer}
.dlg .who{font:500 calc(11px*var(--u,1)) var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--sand)}
.dlg .txt{font-size:clamp(13px,calc(15px*var(--u,1)),26px);line-height:1.5;min-height:3em}
.dlg.nar .txt{font-style:italic;color:#c9d3d6}
.dlg .nxt{font:500 calc(11px*var(--u,1)) var(--f-mono);color:var(--mute);justify-self:end}
.opt{background:transparent;border:1px solid var(--line);color:var(--text);padding:10px 12px;text-align:start;font:clamp(13px,calc(15px*var(--u,1)),24px)/1.4 var(--f-body);cursor:pointer}
.opt:hover{border-color:var(--sand)}
[dir=rtl]{font-family:"Cairo",var(--f-body)}
[dir=rtl] h2,[dir=rtl] .btn,[dir=rtl] .opt{font-family:"Cairo",sans-serif;text-transform:none;letter-spacing:0}
[dir=rtl] .tag,[dir=rtl] .who,[dir=rtl] .nxt,[dir=rtl] .rows{font-family:"Cairo",sans-serif;letter-spacing:0;text-transform:none}
</style>

<div class="app" id="app">
  <header>
    <a href="#" id="back" aria-label="Back">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
      </svg>
    </a>
    <div class="header-text">
      <div class="kicker" id="kick">6 October 1973 · 10 Ramadan 1393</div>
      <h1 id="ttl">Operation Badr</h1>
    </div>
    <button class="fs" id="fs" aria-label="Fullscreen" title="Fullscreen">⛶</button>
  </header>
  <div class="hud"><span id="h1"></span><span id="h2"></span></div>
  <div class="wrap" id="wrap">
    <div class="stage" id="stage">
      <canvas id="cv" aria-label="Game stage"></canvas>
      <div class="dlg" id="dlg" hidden></div>
      <div class="ov" id="ov"></div>
    </div>
  </div>
</div>

<script>
(function(){
const W=400,H=600;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const ov=document.getElementById('ov'),dlg=document.getElementById('dlg');
const stage=document.getElementById('stage'),wrap=document.getElementById('wrap');
const DPR=Math.min(window.devicePixelRatio||1,2);
cv.width=W*DPR;cv.height=H*DPR;
const $=s=>document.querySelector(s);
const C={sand:'#d2ad6e',sandDk:'#8f7240',sandLt:'#e4c98f',canal:'#1d7a96',canalLt:'#5fb6cf',canalDk:'#12546b',flag:'#c8392f',ink:'#0f1a20',text:'#e7e3d6'};
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const MONO='"IBM Plex Mono",ui-monospace,monospace';

/* ───── language ───── */
let LANG='en';
const T=(en,ar)=>({en,ar});
const tr=x=>(x&&typeof x==='object')?x[LANG]:x;
const nn=s=>LANG==='ar'?String(s).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]):String(s);
const NM={hassan:T('Hassan','حسن'),adel:T('Adel','عادل'),mostafa:T('Mostafa','مصطفى'),samir:T('Samir','سمير'),sayed:T('Sayed','سيد')};
function detectLang(){
  let v='';
  try{
    const m=document.cookie.split(';').map(c=>c.trim()).find(c=>c.slice(0,7)==='locale=');
    if(m)v=decodeURIComponent(m.slice(7));
  }catch(_){}
  if(!v){try{v=(location.hash||'').replace('#','')}catch(_){}}
  if(!v){try{v=navigator.language||''}catch(_){}}
  return String(v).toLowerCase().replace(/^["']|["']$/g,'').slice(0,2)==='ar'?'ar':'en';
}
$('#back').addEventListener('click',e=>{e.preventDefault();window.history.back()});
function setLang(l){
  LANG=l;const d=l==='ar'?'rtl':'ltr';ov.dir=d;dlg.dir=d;
  document.documentElement.setAttribute('data-lang',l);
  const hd=document.querySelector('header');if(hd)hd.dir=d;
  $('#back').setAttribute('aria-label',l==='ar'?'رجوع':'Back');
  $('#fs').setAttribute('aria-label',l==='ar'?'ملء الشاشة':'Fullscreen');
  $('#ttl').textContent=tr(T('Operation Badr','عملية بدر'));
  $('#kick').textContent=tr(T('6 October 1973 · 10 Ramadan 1393','٦ أكتوبر ١٩٧٣ · ١٠ رمضان ١٣٩٣'));
}
const BTN={start:T('Start','ابدأ'),again:T('Play again','العب مرة أخرى')};

/* story state */
let F={},SC={};
function resetState(){F={letter:false,honest:false,brave:false,cool:false,wash:false,tea:false,adel:''};SC={}}
resetState();

/* ───── fit stage to the viewport ───── */
function fit(){
  const r=wrap.getBoundingClientRect();
  const w=Math.max(220,Math.min(r.width-2,(r.height-2)*2/3));
  stage.style.width=w+'px';stage.style.height=(w*1.5)+'px';
  stage.style.setProperty('--u',(w/420).toFixed(3));
}
if(window.ResizeObserver)new ResizeObserver(fit).observe(wrap);
addEventListener('resize',fit);
document.addEventListener('fullscreenchange',()=>setTimeout(fit,60));
fit();
const fsb=$('#fs');
if(!document.fullscreenEnabled)fsb.hidden=true;
fsb.onclick=()=>{try{if(document.fullscreenElement)document.exitFullscreen();else{const p=$('#app').requestFullscreen();if(p&&p.catch)p.catch(()=>{})}}catch(_){}};

/* ───── input ───── */
const ptr={x:W/2,y:H/2,down:false};
const keys={};
function setPtr(e){const r=cv.getBoundingClientRect();ptr.x=(e.clientX-r.left)/r.width*W;ptr.y=(e.clientY-r.top)/r.height*H}
cv.addEventListener('pointerdown',e=>{setPtr(e);ptr.down=true;try{cv.setPointerCapture(e.pointerId)}catch(_){}if(S&&!S.paused&&S.down)S.down(ptr.x,ptr.y)});
cv.addEventListener('pointermove',setPtr);
const up=()=>{ptr.down=false};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'){
    if(!dlg.hidden&&adv){adv();e.preventDefault();return}
    if(e.code!=='Enter'&&S&&!S.paused&&S.jump&&document.activeElement.tagName!=='BUTTON'){S.jump();e.preventDefault()}
  }
});
addEventListener('keyup',e=>{delete keys[e.code]});

/* ───── dialogue engine ───── */
let adv=null;
function say(items,done){
  let i=0;
  const next=()=>{
    if(i>=items.length){dlg.hidden=true;adv=null;done&&done();return}
    const it=items[i++];
    if(it.ask)choose(it.ask,next);else line(it,next);
  };
  next();
}
function line(it,next){
  dlg.hidden=false;
  dlg.innerHTML='<div class="who"></div><div class="txt"></div><div class="nxt"></div>';
  const who=dlg.querySelector('.who'),txt=dlg.querySelector('.txt');
  dlg.querySelector('.nxt').textContent=tr(T('tap ▸','المس ◂'));
  who.textContent=it.w?tr(NM[it.w]):'';who.hidden=!it.w;
  dlg.classList.toggle('nar',!it.w);
  const full=tr(it.t);
  let n=0,timer=setInterval(()=>{n++;txt.textContent=full.slice(0,n);if(n>=full.length){clearInterval(timer);timer=null}},16);
  adv=()=>{
    if(timer){clearInterval(timer);timer=null;txt.textContent=full;return}
    adv=null;next();
  };
}
function choose(opts,next){
  dlg.hidden=false;dlg.classList.remove('nar');adv=null;
  dlg.innerHTML='<div class="who">'+tr(T('Your choice','اختيارك'))+'</div>';
  opts.forEach(o=>{
    const b=document.createElement('button');b.className='opt';b.textContent=tr(o.l);
    b.onclick=e=>{e.stopPropagation();o.f&&o.f();say(o.say||[],next)};
    dlg.appendChild(b);
  });
}
dlg.addEventListener('click',()=>{adv&&adv()});

/* ───── drawing helpers ───── */
function label(txt,x,y,col,size,align){
  ctx.font='500 '+(size||9)+'px '+(LANG==='ar'?'"Cairo",sans-serif':MONO);
  ctx.textAlign=align||'center';ctx.fillStyle=col||C.ink;ctx.fillText(tr(txt),x,y);
}
function hex(c){return[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]}
function mix(a,b,k){const A=hex(a),B=hex(b);return'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*k)).join(',')+')'}
function person(x,y,o){
  const s=o.s||1.3;
  ctx.save();ctx.translate(x,y);ctx.scale(s*((o.face||1)<0?-1:1),s);
  const sw=o.walk?Math.sin(o.walk)*5:0,body=o.body||'#6d6a43';
  ctx.fillStyle='#3b3a28';ctx.fillRect(-5+sw,-16,4.5,16);ctx.fillRect(.5-sw,-16,4.5,16);
  ctx.fillStyle=body;ctx.fillRect(-7,-32,14,17);
  ctx.fillStyle=mix(body,'#000000',.25);ctx.fillRect(-9,-31,3,13);
  if(o.pack){ctx.fillStyle='#4a4a30';ctx.fillRect(-11,-30,5,14)}
  ctx.fillStyle='#c99a6e';ctx.beginPath();ctx.arc(0,-38,6.5,0,6.283);ctx.fill();
  if(o.stache){ctx.fillStyle='#2a1c14';ctx.fillRect(1,-36,6,1.8)}
  if(o.hat==='cap'){ctx.fillStyle='#1c1f18';ctx.fillRect(-7,-46,14,5);ctx.fillRect(-1,-42,10,1.8)}
  else{ctx.fillStyle='#4e5632';ctx.beginPath();ctx.arc(0,-39,7.8,Math.PI,0);ctx.closePath();ctx.fill();ctx.fillRect(-8.5,-39.5,17,2)}
  if(o.rifle){ctx.strokeStyle='#241c12';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-3,-22);ctx.lineTo(13,-33);ctx.stroke()}
  if(o.paper){ctx.fillStyle='#efe9d8';ctx.fillRect(5,-27,8,10)}
  if(o.pot){ctx.fillStyle='#b8b8b0';ctx.fillRect(6,-24,9,8);ctx.fillRect(14,-22,3,2);ctx.fillStyle='#8a8a84';ctx.fillRect(7,-27,7,3)}
  ctx.restore();
}
function sandBg(y0,top,bot){const g=ctx.createLinearGradient(0,y0,0,H);g.addColorStop(0,top);g.addColorStop(1,bot);ctx.fillStyle=g;ctx.fillRect(0,y0,W,H-y0)}
function duneField(off){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,C.sandLt);g.addColorStop(1,C.sand);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(143,114,64,.38)';ctx.lineWidth=1.2;
  for(let i=-1;i<9;i++){
    const y=((i*80+off)%(H+160))-80;
    ctx.beginPath();ctx.moveTo(0,y);
    for(let x=0;x<=W;x+=20)ctx.lineTo(x,y+Math.sin((x+i*37)*0.03)*6);
    ctx.stroke();
  }
}
function drawWater(t){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,C.canalDk);g.addColorStop(1,C.canal);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(95,182,207,.28)';ctx.lineWidth=1.2;
  for(let j=0;j<22;j++){
    const y=((j*34+t*26)%(H+34));
    ctx.beginPath();
    for(let x=0;x<=W;x+=16){const yy=y+Math.sin(x*0.05+j+t*2)*2;x?ctx.lineTo(x,yy):ctx.moveTo(x,yy)}
    ctx.stroke();
  }
  ctx.fillStyle=C.sand;ctx.fillRect(0,0,W,58);
  ctx.fillStyle=C.sandDk;ctx.beginPath();ctx.moveTo(0,58);
  for(let x=0;x<=W;x+=25)ctx.lineTo(x,50+((x/25)%2?10:0));
  ctx.lineTo(W,70);ctx.lineTo(0,70);ctx.closePath();ctx.fill();
  ctx.fillStyle=C.sand;ctx.fillRect(0,566,W,H-566);
  ctx.fillStyle=C.sandDk;ctx.fillRect(0,562,W,5);
  label(T('EAST BANK · SINAI','الضفة الشرقية · سيناء'),10,22,'rgba(15,26,32,.55)',10,'left');
  label(T('WEST BANK','الضفة الغربية'),10,588,'rgba(15,26,32,.55)',10,'left');
}
const STARS=Array.from({length:55},(_,i)=>({x:(i*137.5)%400,y:(i*53.7)%230,r:i%7===0?1.6:1}));
function boom(f){
  const k=f.a;
  ctx.strokeStyle='rgba(255,236,190,'+(1-k)+')';ctx.lineWidth=3*(1-k)+1;
  ctx.beginPath();ctx.arc(f.x,f.y,6+k*44,0,6.283);ctx.stroke();
  ctx.fillStyle='rgba(200,57,47,'+(.7*(1-k))+')';ctx.beginPath();ctx.arc(f.x,f.y,(6+k*44)*.55,0,6.283);ctx.fill();
}

/* ═════ 1: the camp ═════ */
const NPCS=[
  {id:'adel',name:T('ADEL','عادل'),x:44,o:{s:1.15,hat:'cap',paper:true}},
  {id:'sayed',name:T('SAYED','سيد'),x:192,o:{s:1.2,hat:'cap',body:'#7d7a55',pot:true}},
  {id:'mostafa',name:T('SGT. MOSTAFA','الرقيب مصطفى'),x:268,o:{s:1.35,hat:'helmet',stache:true,rifle:true}},
  {id:'samir',name:T('CAPT. SAMIR','النقيب سمير'),x:352,o:{s:1.3,hat:'cap',body:'#7a7550'}}
];
const TALK={
  adel:()=>[
    {w:'adel',t:T('Corporal Hassan! You write better than I do. Will you help me with a letter to my mother?','يا عريف حسن! خطك أحسن من خطي. تكتبلي جواب لأمي؟')},
    {ask:[
      {l:T('Sit down. What do you want to say?','اقعد. عايز تقول إيه؟'),f:()=>{F.letter=true},say:[
        {w:'adel',t:T('That I eat well. That the army is kind. That I am not afraid.','أقولها إني باكل كويس. وإن الجيش طيب. وإني مش خايف.')},
        {w:'hassan',t:T('Three lies in one sentence.','تلات كدبات في جملة واحدة.')},
        {w:'adel',t:T('Then make it two.','خليهم اتنين.')},
        {t:T('You write it together by the fire. He folds it small and tucks it into his helmet liner.','تكتبان الجواب معًا قرب النار. يطويه صغيرًا ويدسّه داخل خوذته.')}]},
      {l:T('Not tonight, Adel. Get some sleep.','مش النهاردة يا عادل. نام شوية.'),say:[
        {w:'adel',t:T('Yes, Corporal.','حاضر يا عريف.')},
        {t:T('He folds the blank page and puts it away. He holds the pencil a little longer.','يطوي الورقة البيضاء ويخبّئها، ويظل ممسكًا بالقلم لحظة أطول.')}]}
    ]}],
  sayed:()=>[
    {t:T('Sayed, the unit’s orderly, is boiling tea over the fire as if it were any other night.','سيد، فرّاش الوحدة، يغلي الشاي فوق النار كأنها ليلة عادية.')},
    {w:'sayed',t:T('We broke the fast an hour ago. Dates, then tea, same as at home. Tea, Corporal? Strong, plenty of sugar.','فطرنا من ساعة. تمر وبعدين شاي، زي البيت بالظبط. شاي يا عريف؟ تقيل وسكر زيادة.')},
    {ask:[
      {l:T('Pour me one. And one for Mostafa.','صب لي كوباية. وواحدة لمصطفى.'),f:()=>{F.tea=true},say:[{w:'sayed',t:T('Two sugars for the sergeant. He will pretend he does not like it.','لمصطفى معلقتين سكر. وهيتظاهر إنه مش بيحبه.')}]},
      {l:T('No time, Sayed. Tomorrow we drink to it.','مفيش وقت يا سيد. بكرة نشربها احتفالًا.'),say:[{w:'sayed',t:T('In sha’ Allah. I will keep the pot warm.','إن شاء الله. هفضّل مسخّن الإبريق.')}]}
    ]}],
  mostafa:()=>[
    {t:T('Sergeant Mostafa is from Port Said. He stares toward the water, though it is too dark to see it.','الرقيب مصطفى من بورسعيد. يحدّق نحو الماء، رغم أن الظلام يحجبه.')},

    ctx.setLineDash([4,3]);ctx.beginPath();ctx.moveTo(-12,0);ctx.lineTo(12,0);ctx.stroke();ctx.setLineDash([]);
  }else if(k===2){

/* ═════ 4: the ridge (runner with the flag) ═════ */

  ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,GROUND);
  for(let x=0;x<=W;x+=10)ctx.lineTo(x,base+Math.sin((x+off*par)*.012)*amp+Math.sin((x+off*par)*.031)*amp*.4);
  ctx.lineTo(W,GROUND);ctx.closePath();ctx.fill();
}
const RUN={
  init(){
    this.dist=0;this.y=GROUND;this.vy=0;this.hearts=3;this.inv=0;this.t=0;this.state='run';this.pt=0;this.done=false;this.dawn=false;

  },
  jump(){if(this.state==='run'&&this.y>=GROUND-.5)this.vy=-560},

  hurt(){this.hearts=Math.max(0,this.hearts-1);this.inv=1.2},
  update(dt){

          const bad=o.type==='wire'?this.y>GROUND-20:this.y>GROUND-5;
          if(bad){o.hit=true;if(this.inv<=0)this.hurt()}
        }
      }

const BR_N=9,SEC_H=54,SEC_BASE=566;
const BRIDGE={
  init(){this.sec=[{cx:200,w:150}];this.start=150;this.cur={x:60,dir:1,w:150};this.sp=130;this.misses=0;this.perf=0;this.fx=[];this.t=0;this.done=false},
  curTop(){return SEC_BASE-SEC_H*(this.sec.length+1)},
  down(){

      }else{ctx.strokeStyle='rgba(231,227,214,'+(.5*(1-k))+')';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(f.x,f.y,6+k*14,0,6.283);ctx.stroke()}
    }
    if(this.rl>0){ctx.fillStyle='rgba(231,227,214,.18)';ctx.fillRect(30,466,150,6);ctx.fillStyle=C.sand;ctx.fillRect(30,466,150*(1-this.rl/.7),6)}
    if(this.t<4)label(T('Tap a tank to fire. Do not let them cross the red line.','المس الدبابة لإطلاق النار. لا تدعها تتجاوز الخط الأحمر.'),W/2,40,'rgba(231,227,214,.92)',12);
  },
  hud(){return[tr(T('Line ','الخط '))+'●'.repeat(this.hearts)+'○'.repeat(3-this.hearts),tr(T('Tanks hit ','دبابات مصابة '))+nn(this.kills)+' / '+nn(D_TOT)]},
  score(){return Math.round(this.kills/D_TOT*100)}
};

let S=null;
function setScene(s,paused){S=s;s.paused=!!paused;s.fired=false;s.onDone=null;s.init()}
function card(html,btn,cb){
  ov.hidden=false;
  ov.innerHTML='<div class="in">'+html+'<div class="btns"><button class="btn" id="go">'+btn+'</button></div></div>';
  ov.scrollTop=0;
  const b=$('#go');b.onclick=()=>{ov.hidden=true;cb()};
  try{b.focus({preventScroll:true})}catch(_){}
}
const tag=t=>'<div class="tag">'+tr(t)+'</div>';
function chap(o,cb){
  card(tag(o.tag)+'<h2>'+tr(o.h)+'</h2><p>'+tr(o.p)+'</p>'+(o.how?'<p class="how">'+tr(o.how)+'</p>':''),tr(BTN.start),cb);

function finish(){
  const keysS=['spot','cross','run','breach','bridge','defend'];
  const names=[T('Marking targets','تحديد الأهداف'),T('Boat crossing','عبور اللنش'),T('Flag on the ridge','العلم على الربوة'),T('Earth rampart','الساتر الترابي'),T('The bridge','الكوبري'),T('Hold the line','تثبيت الخط')];
  const sc=keysS.map(k=>SC[k]||0);
  const avg=Math.round(sc.reduce((a,b)=>a+b,0)/sc.length);
  const rank=avg>=80?T('Crossing secured','تم تأمين العبور'):avg>=50?T('Bridgehead held','رأس الكوبري صامد'):T('Bridgehead contested','رأس الكوبري متنازع عليه');
  const rows=sc.map((s,i)=>'<div><span>'+tr(names[i])+'</span><span>'+nn(s)+'%</span></div>').join('');
  const facts=[
    [T('The barrier.','الحاجز.'),T('The Bar Lev Line was a chain of earth ramparts and fortified positions along the canal’s east bank.','كان خط بارليف سلسلة من السواتر الترابية والنقاط الحصينة على الضفة الشرقية للقناة.')],
    [T('The idea.','الفكرة.'),T('Opening the rampart with pumped water is credited to the Egyptian engineer Baqi Zaki Youssef.','يُنسب فتح الساتر الترابي بالمياه المضخوخة إلى المهندس المصري باقي زكي يوسف.')],
    [T('The name.','الاسم.'),T('Badr recalls the Battle of Badr, fought in Ramadan, the month in which the war began.','تستحضر «بدر» غزوة بدر التي وقعت في رمضان، الشهر الذي بدأت فيه الحرب.')],
    [T('Afterwards.','بعد الحرب.'),T('The war led to negotiations and, in 1979, the Egypt–Israel peace treaty. Egypt marks 6 October every year.','قادت الحرب إلى مفاوضات ثم إلى معاهدة السلام المصرية الإسرائيلية عام ١٩٧٩. وتحتفل مصر كل عام بذكرى السادس من أكتوبر.')]
  ].map(f=>'<li><b>'+tr(f[0])+'</b> '+tr(f[1])+'</li>').join('');
  card(tag(rank)+'<div class="big">'+nn(avg)+'<small>%</small></div><div class="rows">'+rows+'</div><ul class="facts">'+facts+'</ul>',tr(BTN.again),title);
}

/* ───── loop ───── */
let last=0;
function frame(ts){
  const dt=Math.min(.05,((ts-last)/1000)||0);last=ts;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(S){
